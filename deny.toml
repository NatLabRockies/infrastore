# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    # The HDF Group's own license, carried by `hdf5-metno-src` (the vendored HDF5
    # sources pulled in by `infrastore-core`'s default `vendored` feature). It is a
    # BSD-3-Clause variant -- the text states it "is covered by the 3-clause BSD
    # License" -- but SPDX catalogs it under its own identifier, so it has to be
    # allowed by name.
    "HDF5",
    "ISC",
    "MIT",
    # MIT No Attribution, carried by `borrow-or-share` (reached through
    # `jsonschema -> referencing -> fluent-uri`, which `infrastore-core` pulls in
    # to validate the OpenAPI import path against the vendored SiennaSchemas
    # specs). It is MIT with the attribution clause dropped, so it is strictly
    # more permissive than the `MIT` above, but SPDX gives it its own identifier
    # and it has to be allowed by name. It reached this list when `jsonschema`
    # moved from a dev-dependency to a real one: cargo-deny leaves dev
    # dependencies out of its graph, so the tree was never license-checked until
    # then.
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

[[licenses.clarify]]
crate = "cargo-husky"
expression = "MIT"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
