# Allow `cargo build --workspace` to link the PyO3 cdylib on macOS without
# embedding libpython (the Python interpreter resolves symbols at load time
# when the extension is imported). This mirrors what `maturin develop` does
# implicitly.

[target.aarch64-apple-darwin]
rustflags = [
    "-C", "link-arg=-undefined",
    "-C", "link-arg=dynamic_lookup",
]

[target.x86_64-apple-darwin]
rustflags = [
    "-C", "link-arg=-undefined",
    "-C", "link-arg=dynamic_lookup",
]
