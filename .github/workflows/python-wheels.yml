# Build (and, on tags, publish) the `infrastore` Python wheels.
#
# The PyO3 crate statically links netcdf-c + HDF5 + zlib, built from vendored
# sources by infrastore's default `vendored` feature, so cibuildwheel only has to
# install Rust in `before-all` (see [tool.cibuildwheel] in pyproject.toml) and
# the wheels carry no external NetCDF/HDF5 to repair in.
name: python-wheels

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["crates/infrastore-py/**", "crates/infrastore-core/**"]
  workflow_dispatch:

jobs:
  wheels:
    name: wheels ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS bundles Homebrew's HDF5/NetCDF, which are built for the runner's
        # OS version; the wheel's deployment target must match or delocate rejects
        # the libraries. Keep each macos-NN entry in sync with its runner image.
        include:
          - os: ubuntu-latest
          - os: macos-14
            macosx_deployment_target: "14.0"
          - os: windows-latest
    defaults:
      run:
        working-directory: crates/infrastore-py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # No HDF5/NetCDF provisioning on any platform: the default `vendored`
      # feature builds them from source into the extension module. Do not
      # reintroduce a step exporting HDF5_DIR/NETCDF_DIR -- they redirect the
      # vendored netcdf-c build at an external HDF5 and break it. See test.yml.
      - name: Build wheels
        uses: pypa/cibuildwheel@v4.1.0
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macosx_deployment_target }}
        with:
          package-dir: crates/infrastore-py
          output-dir: wheelhouse
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: crates/infrastore-py/wheelhouse/*.whl

  publish:
    name: publish to PyPI
    needs: wheels
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
