# Build (and, on tags, publish) the `time-series-store` Python wheels.
#
# The PyO3 crate links libnetcdf + libhdf5; cibuildwheel installs Rust and the
# system HDF5/NetCDF in `before-all` (see [tool.cibuildwheel] in pyproject.toml)
# and repairs each wheel to bundle the shared libraries (auditwheel/delocate).
name: python-wheels

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["crates/time-series-store-py/**", "crates/time-series-store-core/**"]
  workflow_dispatch:

jobs:
  wheels:
    name: wheels ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS bundles Homebrew's HDF5/NetCDF, which are built for the runner's
        # OS version; the wheel's deployment target must match or delocate rejects
        # the libraries. Keep each macos-NN entry in sync with its runner image.
        include:
          - os: ubuntu-latest
          - os: macos-14
            macosx_deployment_target: "14.0"
          - os: windows-latest
    defaults:
      run:
        working-directory: crates/time-series-store-py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # cibuildwheel's before-all handles HDF5/NetCDF on Linux/macOS, but Windows
      # has no system package manager, so provision from conda-forge here
      # (mirrors test.yml) and export the locations for the
      # netcdf-sys/hdf5-metno-sys build scripts. conda-forge ships prebuilt
      # binaries; `vcpkg install netcdf-c` instead builds from source and fetches
      # libaec from gitlab.dkrz.de, which rate-limits (HTTP 429) CI runners.
      - name: Install native dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:Path = "$env:CONDA;$env:CONDA\Scripts;$env:Path"
          conda create -y -p "$env:RUNNER_TEMP\netcdf" -c conda-forge libnetcdf hdf5
          # conda lays Windows headers/libs/DLLs out under <prefix>\Library.
          $prefix = "$env:RUNNER_TEMP\netcdf\Library"
          "NETCDF_DIR=$prefix" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "HDF5_DIR=$prefix" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PKG_CONFIG_PATH=$prefix\lib\pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$prefix\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build wheels
        uses: pypa/cibuildwheel@v4.1.0
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macosx_deployment_target }}
        with:
          package-dir: crates/time-series-store-py
          output-dir: wheelhouse
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: crates/time-series-store-py/wheelhouse/*.whl

  publish:
    name: publish to PyPI
    needs: wheels
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
