# Build the release executables and the C ABI shared library, attach them to a
# draft GitHub Release, and publish versioned documentation. The lib targets
# additionally package per-platform Julia artifact tarballs
# (libinfrastore_ffi.<triplet>.tar.gz, internal layout lib/<library>) that
# InfraStore.jl's Artifacts.toml points at; see docs/src/releasing.md.
#
# This is the third workflow that fires on a `v*` tag. The other two publish to
# package registries and are deliberately not duplicated here:
#   crates-release.yml -> crates.io (trusted publishing, tag/version check,
#                         already-published guard)
#   python-wheels.yml  -> PyPI (cibuildwheel, trusted publishing)
name: release

on:
  push:
    tags: ["v*"]
  # Smoke-test the build matrix whenever this file changes, the way
  # python-wheels.yml does for the wheel build. Without it the matrix is
  # unreachable before merge: `workflow_dispatch` cannot be triggered on a
  # branch until the workflow exists on the default branch, so an edit here
  # would otherwise get its first real run on a tag, where a failure is
  # expensive. `create-release` and `deploy-docs` are gated on a tag ref, so a
  # pull request only exercises `build`.
  pull_request:
    paths: [".github/workflows/release.yml"]
  workflow_dispatch:

# Granted per job rather than workflow-wide: only create-release (draft +
# assets) and deploy-docs (push to gh-pages) need write access, and the build
# matrix has no reason to hold it.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # `payload` selects what gets built and packaged:
        #   bins -> the `infrastore` CLI and the `infrastore-server` binary
        #   lib  -> libinfrastore_ffi + the generated C header, which is what
        #           InfraStore.jl dlopens via INFRASTORE_LIB, plus the Julia
        #           artifact tarball (see "Package Julia artifact" below)
        #
        # `artifact_triplet` names the Julia artifact tarball, in
        # BinaryBuilder-style triplet form. `manylinux` routes the build into
        # that container image (see the container build step for why).
        # `macosx_deployment_target` is the Darwin analogue of the glibc
        # floor: without it the dylib requires the runner's own macOS version.
        #
        # Linux appears three times on purpose. musl gives statically linked
        # executables that run on any distro, including the older glibc on HPC
        # login nodes -- but a musl-built cdylib loaded into a glibc Julia
        # process puts two libcs in one address space, so the shared library
        # comes from gnu builds instead, one per architecture, run inside
        # manylinux2014 containers so their floor is glibc 2.17 rather than
        # the bare runner's ~2.39.
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            payload: bins+lib
            artifact_triplet: aarch64-apple-darwin
            # Matches what python-wheels.yml targets on this runner.
            macosx_deployment_target: "14.0"

          - os: macos-15-intel
            target: x86_64-apple-darwin
            payload: lib
            artifact_triplet: x86_64-apple-darwin
            # Deliberately older than the runner: Intel Macs largely stopped
            # at macOS 13, and the SDK supports targeting it.
            macosx_deployment_target: "13.0"

          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            payload: bins

          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            payload: lib
            artifact_triplet: x86_64-linux-gnu
            manylinux: quay.io/pypa/manylinux2014_x86_64

          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            payload: lib
            artifact_triplet: aarch64-linux-gnu
            manylinux: quay.io/pypa/manylinux2014_aarch64

          # The tarball is named per Julia convention (mingw32) even though
          # the build is MSVC -- Pkg selects on the arch/os keys in
          # Artifacts.toml; the triplet is only a filename.
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            payload: bins+lib
            artifact_triplet: x86_64-w64-mingw32

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Skipped on the manylinux jobs: their toolchain lives inside the
      # container, installed by the container build step below.
      - name: Setup Rust
        if: ${{ !matrix.manylinux }}
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # infrastore-proto's build script shells out to protoc, so the server
      # build needs it. The lib-only jobs build just infrastore-ffi, which has
      # no proto dependency.
      - name: Setup protobuf compiler
        if: contains(matrix.payload, 'bins')
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # The vendored HDF5 + zlib build compiles C, so the musl target needs a
      # musl C toolchain; the `cc` crate then hands musl-gcc to cmake. Host and
      # target are both x86_64 Linux, so cmake still treats this as a native
      # build and HDF5's configure-time try_run probes work.
      - name: Install musl toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      # No HDF5 provisioning on any platform, and never set HDF5_DIR here: the
      # default `vendored` feature builds HDF5 + zlib from source and links them
      # statically. See the long comment in test.yml for what setting those
      # variables breaks.

      # Swatinem/rust-cache rather than torc's hand-rolled actions/cache over
      # `target/`: it keys on the target triple and drops the workspace's own
      # build artifacts from the cache, so a release build cannot pick up a
      # stale `infrastore` binary from an earlier run.
      # Skipped on the manylinux jobs: the build runs in the container with an
      # ephemeral cargo home, so the host cache would hold only target/, keyed
      # by a host toolchain the build never uses. A release-cadence cold build
      # is an acceptable cost for that simplicity.
      - name: Cache Cargo
        if: ${{ !matrix.manylinux }}
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Selected packages rather than `--workspace`: the workspace also holds
      # infrastore-py, whose PyO3 cdylib needs an interpreter to link against
      # and has no business in these archives, and infrastore-bench, which is an
      # internal tool. `--locked` pins the committed Cargo.lock -- a release
      # should build exactly what CI tested.
      - name: Build
        if: ${{ !matrix.manylinux }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ matrix.macosx_deployment_target }}" ]; then
            export MACOSX_DEPLOYMENT_TARGET="${{ matrix.macosx_deployment_target }}"
          fi
          packages=()
          case "${{ matrix.payload }}" in
            *bins*) packages+=(-p infrastore-cli -p infrastore-server) ;;
          esac
          case "${{ matrix.payload }}" in
            *lib*) packages+=(-p infrastore-ffi) ;;
          esac
          cargo build --release --locked --all-features \
            --target ${{ matrix.target }} "${packages[@]}"

      # The gnu cdylibs build inside manylinux2014 containers (glibc 2.17) so
      # the artifact loads on old HPC images. Built on the bare runner they
      # would inherit its glibc as their floor and fail at dlopen time on
      # older systems -- silently, because the runner that built them can
      # always load them. python-wheels.yml gets the same property via
      # cibuildwheel, which spawns these same images itself; a `container:`
      # job is not an option because the runner's Node-based actions
      # (checkout, upload) cannot execute on glibc 2.17.
      #
      # The container brings its own Rust (host triple == target, so no cross
      # setup) and a pip-installed cmake (the vendored HDF5 needs >= 3.26; the
      # image's Python bin dir goes first on PATH so pip's console script
      # wins). The workspace is bind-mounted, so products land in target/
      # exactly like a host build and the later steps need no special casing.
      - name: Build (manylinux container)
        if: matrix.manylinux
        shell: bash
        run: |
          set -euo pipefail
          cat > .manylinux-build.sh <<'EOF'
          set -euo pipefail
          PYBIN=$(ls -d /opt/python/cp3*/bin | sort -V | tail -1)
          export PATH="${PYBIN}:${PATH}"
          pip install --quiet cmake
          cmake --version
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          export PATH="${HOME}/.cargo/bin:${PATH}"
          cargo build --release --locked --all-features \
            --target "${BUILD_TARGET}" -p infrastore-ffi
          # The container runs as root; hand the products back to the host
          # user so later steps and runner cleanup never meet root-owned
          # files (a hosted runner would not care, a self-hosted one would).
          chown -R "${CHOWN_TO}" target
          EOF
          docker run --rm \
            -v "$PWD:/work" -w /work \
            -e BUILD_TARGET="${{ matrix.target }}" \
            -e CHOWN_TO="$(id -u):$(id -g)" \
            "${{ matrix.manylinux }}" \
            bash .manylinux-build.sh
          rm .manylinux-build.sh

      # The acceptance check for the self-hosted artifacts: fail the release
      # if any dynamic symbol requires a glibc newer than the manylinux2014
      # floor. This is what makes the floor enforced rather than hoped-for.
      - name: Enforce the glibc floor
        if: matrix.manylinux
        shell: bash
        run: |
          set -euo pipefail
          so="target/${{ matrix.target }}/release/libinfrastore_ffi.so"
          syms=$(objdump -T "$so" | grep -oE 'GLIBC_[0-9.]+' | sort -uV || true)
          echo "referenced glibc symbol versions:"
          echo "$syms"
          bad=$(echo "$syms" | sed 's/GLIBC_//' \
            | awk -F. 'NF && !($1 < 2 || ($1 == 2 && $2 <= 17))' || true)
          if [ -n "$bad" ]; then
            echo "::error::glibc floor exceeded: version(s) $bad required, max allowed is 2.17"
            exit 1
          fi

      # An executable that links but does not start is still a broken release,
      # and nothing downstream would notice -- the archive step only copies
      # files. The musl binaries are static, so the glibc runner runs them
      # directly. `infrastore-server` has no `--version`, hence `--help`.
      - name: Smoke-test the executables
        if: contains(matrix.payload, 'bins')
        shell: bash
        run: |
          set -euo pipefail
          out="target/${{ matrix.target }}/release"
          case "$RUNNER_OS" in
            Windows) exe=".exe" ;;
            *)       exe="" ;;
          esac
          "$out/infrastore$exe" --version
          "$out/infrastore-server$exe" --help > /dev/null

      # Same rationale for the shared library: an artifact that packages but
      # does not dlopen is a broken release for every Julia user. ctypes both
      # loads the library and resolves a known export. On Linux this also
      # proves the container-built .so loads outside the container.
      - name: Smoke-test the shared library
        if: contains(matrix.payload, 'lib')
        shell: bash
        run: |
          set -euo pipefail
          out="target/${{ matrix.target }}/release"
          case "$RUNNER_OS" in
            Linux)   lib="$out/libinfrastore_ffi.so" ;;
            macOS)   lib="$out/libinfrastore_ffi.dylib" ;;
            Windows) lib="$out/infrastore_ffi.dll" ;;
          esac
          case "$RUNNER_OS" in
            Windows) py=python ;;
            *)       py=python3 ;;
          esac
          "$py" - "$lib" <<'EOF'
          import ctypes
          import sys

          lib = ctypes.CDLL(sys.argv[1])
          assert lib.infrastore_last_error_message is not None
          print("loaded", sys.argv[1])
          EOF

      - name: Create release archive
        id: archive
        shell: bash
        run: |
          set -euo pipefail
          out="target/${{ matrix.target }}/release"
          rm -rf staging release
          mkdir -p staging release

          case "$RUNNER_OS" in
            Windows) exe=".exe" ;;
            *)       exe="" ;;
          esac

          case "${{ matrix.payload }}" in
            *bins*)
              cp "$out/infrastore$exe" "$out/infrastore-server$exe" staging/
              ;;
          esac

          case "${{ matrix.payload }}" in
            *lib*)
              case "$RUNNER_OS" in
                Linux) cp "$out/libinfrastore_ffi.so" staging/ ;;
                macOS)
                  cp "$out/libinfrastore_ffi.dylib" staging/
                  # Cargo bakes the absolute build path into LC_ID_DYLIB, so a
                  # shipped dylib would otherwise advertise itself as living
                  # under the runner's work directory. Julia does not care --
                  # it dlopens the absolute INFRASTORE_LIB path -- but anything
                  # that links against the library at build time would inherit
                  # that path. install_name_tool re-signs ad hoc on its own, so
                  # the library still loads afterwards.
                  install_name_tool -id @rpath/libinfrastore_ffi.dylib \
                    staging/libinfrastore_ffi.dylib
                  ;;
                # The import library ships too, for C consumers linking at
                # build time; Julia only needs the DLL.
                Windows) cp "$out/infrastore_ffi.dll" "$out/infrastore_ffi.dll.lib" staging/ ;;
              esac
              # The header is committed, and infrastore-ffi's build script has
              # just rewritten it in place from this exact source tree.
              cp crates/infrastore-ffi/include/infrastore.h staging/
              ;;
          esac

          cp README.md LICENSE staging/

          if [ "$RUNNER_OS" = Windows ]; then
            name="infrastore-${{ matrix.target }}.zip"
            (cd staging && 7z a "../release/$name" .)
          else
            name="infrastore-${{ matrix.target }}.tar.gz"
            tar czf "release/$name" -C staging .
          fi

          # Checksums travel with the archive so a download can be verified
          # without a second round trip to the release page. macOS ships
          # `shasum` but not `sha256sum`.
          cd release
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$name" > "$name.sha256"
          else
            shasum -a 256 "$name" > "$name.sha256"
          fi
          cd ..

          echo "name=$name" >> "$GITHUB_OUTPUT"
          ls -lh release

      # The Julia artifact tarball: what InfraStore.jl's Artifacts.toml points
      # at, one per platform, named by BinaryBuilder-style triplet. The
      # internal layout is a stability contract -- lib_path() resolves
      # artifact"libinfrastore_ffi"/lib/<library> -- so changing it breaks
      # every registered version that points at these URLs.
      - name: Package Julia artifact
        if: contains(matrix.payload, 'lib')
        shell: bash
        run: |
          set -euo pipefail
          out="target/${{ matrix.target }}/release"
          rm -rf artifact-staging
          mkdir -p artifact-staging/lib

          case "$RUNNER_OS" in
            Linux)   lib="libinfrastore_ffi.so" ;;
            macOS)   lib="libinfrastore_ffi.dylib" ;;
            Windows) lib="infrastore_ffi.dll" ;;
          esac
          cp "$out/$lib" artifact-staging/lib/
          if [ "$RUNNER_OS" = macOS ]; then
            # Same LC_ID_DYLIB scrub as the release archive above.
            install_name_tool -id @rpath/libinfrastore_ffi.dylib \
              artifact-staging/lib/libinfrastore_ffi.dylib
          fi
          cp LICENSE artifact-staging/

          name="libinfrastore_ffi.${{ matrix.artifact_triplet }}.tar.gz"
          tar czf "release/$name" -C artifact-staging .

          cd release
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$name" > "$name.sha256"
          else
            shasum -a 256 "$name" > "$name.sha256"
          fi
          cd ..
          ls -lh release

      # upload@v7 pairs with download@v8 in create-release. That is a newer
      # pairing than the artifact@v4 the rest of this repo uses, and the two
      # must be upgraded together -- an upload major and a download major are
      # only guaranteed to interoperate as the pair the Actions team ships.
      # v4 is not deprecated (only v1-v3 are) so it would also work; this
      # follows torc's release.yml, where the same pairing has green runs.
      # Nothing between v4 and v7 changed the inputs used here: v5 and v6 are
      # Node runtime bumps and v7 adds an optional `archive` input.
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: infrastore-${{ matrix.target }}
          path: release/*
          if-no-files-found: error
          retention-days: 7

  create-release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      # A glob over the download directory rather than one line per matrix
      # entry, so adding a target does not silently ship nothing.
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
            artifacts/**/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-docs:
    name: Deploy Versioned Docs
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    # Shares the group with docs.yml's `latest` deploy: both push to gh-pages,
    # and two concurrent pushes would conflict.
    concurrency:
      group: "pages"
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: '0.4.52'

      - name: Install mdbook-mermaid
        run: cargo install mdbook-mermaid@0.16.0

      - name: Build documentation
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd docs
          # Point this build at its own versioned subdirectory, and send "edit
          # this page" at the tag rather than at main.
          sed -i "s|site-url = \"/infrastore/\"|site-url = \"/infrastore/${VERSION}/\"|" book.toml
          sed -i "s|edit-url-template = \"https://github.com/NatLabRockies/infrastore/edit/main/docs/{path}\"|edit-url-template = \"https://github.com/NatLabRockies/infrastore/tree/${VERSION}/docs/{path}\"|" book.toml
          mdbook build

      - name: Check documentation links
        run: python3 .github/scripts/check-doc-links.py --internal --external

      - name: Setup gh-pages branch
        run: .github/scripts/gh-pages-setup.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Deploy versioned docs
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd gh-pages-deploy

          # Copy the build into its versioned subdirectory
          rm -rf "${VERSION}"
          cp -r ../docs/book "${VERSION}"

          # Root redirect (only if missing -- docs.yml owns it otherwise)
          if [ ! -f index.html ]; then
            cp ../docs/redirect.html index.html
          fi

          # Update versions.json, which version-selector.js reads to populate
          # the picker.
          python3 << 'PYEOF'
          import json, os, re, shutil

          version = os.environ["VERSION"]
          versions_file = "versions.json"

          if os.path.exists(versions_file):
              with open(versions_file) as f:
                  data = json.load(f)
          else:
              data = {"latest_release": None, "versions": []}

          # Rewrite the "latest (main)" entry rather than only inserting it when
          # absent: the deployed versions.json predates the repo rename and
          # still points at /time-series-store/latest/, and docs.yml seeds the
          # file only when it is missing, so nothing else ever repairs it.
          data["versions"] = [v for v in data["versions"] if v["version"] != "latest"]
          data["versions"].insert(0, {
              "version": "latest",
              "label": "latest (main)",
              "path": "/infrastore/latest/",
          })

          # Replace any existing entry for this version (re-running a release
          # should be idempotent)
          data["versions"] = [v for v in data["versions"] if v["version"] != version]
          data["versions"].insert(1, {
              "version": version,
              "label": version,
              "path": f"/infrastore/{version}/",
          })

          def semver_key(v):
              if v["version"] == "latest":
                  return (999, 999, 999)
              # major.minor.patch only; pre-release suffixes are ignored here
              m = re.match(r"v?(\d+)\.(\d+)\.(\d+)", v["version"])
              return (int(m.group(1)), int(m.group(2)), int(m.group(3))) if m else (0, 0, 0)

          data["versions"].sort(key=semver_key, reverse=True)
          data["latest_release"] = version

          # Keep at most MAX_VERSIONS releases (plus "latest"); prune the rest
          # from versions.json and from disk.
          MAX_VERSIONS = 5
          releases = [v for v in data["versions"] if v["version"] != "latest"]
          if len(releases) > MAX_VERSIONS:
              pruned = releases[MAX_VERSIONS:]
              data["versions"] = [v for v in data["versions"] if v not in pruned]
              for p in pruned:
                  if os.path.isdir(p["version"]):
                      shutil.rmtree(p["version"])
                      print(f"Pruned old version: {p['version']}")

          with open(versions_file, "w") as f:
              json.dump(data, f, indent=2)
              f.write("\n")

          print(f"Updated versions.json: {json.dumps(data, indent=2)}")
          PYEOF

      - name: Commit and push
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd gh-pages-deploy
          ../.github/scripts/gh-pages-commit.sh "Deploy docs ${VERSION} from ${GITHUB_SHA::8}"
