name: Test

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup protobuf compiler
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install native dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libhdf5-dev libnetcdf-dev

      - name: Install native dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install hdf5 netcdf

      # Use conda-forge's prebuilt libnetcdf rather than `vcpkg install
      # netcdf-c`. vcpkg builds the stack from source, which fetches libaec from
      # gitlab.dkrz.de -- an unmirrored host that rate-limits (HTTP 429) CI
      # runners and has taken Windows CI down for hours at a time. conda-forge
      # ships binaries, so nothing is compiled and no third-party host is hit.
      # Miniconda is preinstalled on windows-latest ($CONDA).
      - name: Install native dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:Path = "$env:CONDA;$env:CONDA\Scripts;$env:Path"
          conda create -y -p "$env:RUNNER_TEMP\netcdf" -c conda-forge libnetcdf hdf5
          # conda lays Windows headers/libs/DLLs out under <prefix>\Library.
          $prefix = "$env:RUNNER_TEMP\netcdf\Library"
          "NETCDF_DIR=$prefix" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "HDF5_DIR=$prefix" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PKG_CONFIG_PATH=$prefix\lib\pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          # netcdf.dll / hdf5.dll must be on PATH for the test binaries to run.
          "$prefix\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build workspace
        run: cargo build --workspace --all-features

      - name: Run workspace tests
        run: cargo test --workspace --all-features
        env:
          RUST_BACKTRACE: 1
