name: Test

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup protobuf compiler
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # No HDF5 provisioning: the default `vendored` feature builds
      # HDF5 + zlib from source and links them statically, so the
      # build needs only cmake and a C compiler, both preinstalled on the
      # GitHub runner images.
      #
      # Do not reintroduce a step that exports HDF5_DIR. It
      # points the *vendored* HDF5 build at an external HDF5 (it forwards
      # it to cmake as HDF5_ROOT) while still asking for static libraries;
      # against a shared-only install such as conda-forge's that fails with
      # "Could NOT find HDF5 (missing: HDF5_LIBRARIES HDF5_HL_LIBRARIES)".
      # To build against system libraries instead, turn the feature off with
      # `--no-default-features` rather than setting these variables.

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install llvm-tools
        if: matrix.os == 'ubuntu-latest'
        run: rustup component add llvm-tools-preview

      - name: Install cargo-llvm-cov
        if: matrix.os == 'ubuntu-latest'
        uses: taiki-e/install-action@cargo-llvm-cov

      # Coverage is collected on Linux only; one platform's numbers are enough.
      #
      # Every step after this one inherits the instrumentation, so a single pass
      # covers all three suites: the Rust tests, the wheel pytest imports, and
      # the cdylib Julia dlopens. Doctests still execute -- rustdoc does not go
      # through RUSTC_WRAPPER, so they run uninstrumented rather than being
      # skipped.
      #
      # `clean --workspace` is mandatory, and must run after the cache restore.
      # Cargo does not treat RUSTC_WRAPPER as a fingerprint input, so a restored
      # uninstrumented target dir would be reused and every .profraw would
      # silently go missing -- the failure surfaces only as an empty report.
      - name: Enable coverage instrumentation
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov show-env --sh > "$RUNNER_TEMP/cov-env.sh"
          source "$RUNNER_TEMP/cov-env.sh"
          # Re-export through $GITHUB_ENV so later steps inherit it. The heredoc
          # form is required because one value is 0x1f-separated, which the
          # plain KEY=value form would mangle.
          grep '^export ' "$RUNNER_TEMP/cov-env.sh" | sed 's/^export //; s/=.*//' |
            while read -r key; do
              printf '%s<<INFRASTORE_COV_ENV\n%s\nINFRASTORE_COV_ENV\n' "$key" "${!key}"
            done >> "$GITHUB_ENV"

      - name: Build workspace
        run: cargo build --workspace --all-features

      - name: Run workspace tests
        run: cargo test --workspace --all-features
        env:
          RUST_BACKTRACE: 1

      # `cargo test` does not reach the PyO3 or C ABI surfaces, so the Python
      # and Julia suites run here too. Both reuse the build above rather than
      # provisioning HDF5 of their own.
      #
      # The extension is installed as a built wheel: `maturin develop` (what
      # CLAUDE.md documents for local work) requires an active virtualenv,
      # which setup-python does not provide. target/wheels is cleared first so
      # a cached wheel from an earlier run cannot be installed instead.
      # `tzdata` is what makes `zoneinfo` work on Windows, which ships no system
      # time-zone database. The datetime tests name real zones on purpose --
      # the binding's rule is that any aware instant is accepted -- so skipping
      # them there would drop the coverage on the one platform whose zone
      # handling differs.
      - name: Install Python test dependencies
        shell: bash
        run: python -m pip install --upgrade maturin pytest numpy tzdata

      - name: Build and install the Python extension
        shell: bash
        run: |
          rm -rf target/wheels
          maturin build --manifest-path crates/infrastore-py/Cargo.toml --out target/wheels
          python -m pip install target/wheels/*.whl

      - name: Run Python tests
        shell: bash
        run: python -m pytest python/tests -q

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"

      # InfraStore.jl dlopens the cdylib that `cargo build --workspace` already
      # produced, located via INFRASTORE_LIB.
      #
      # On Linux the run also emits Julia's own line counts. That is a separate
      # measurement from the llvm-cov instrumentation above: llvm-cov sees the
      # Rust code this suite drives through the C ABI, `--code-coverage` sees the
      # Julia wrapper itself. Both are uploaded, under different Codecov flags.
      - name: Run Julia tests
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) root=$PWD; lib=libinfrastore_ffi.so ;;
            macOS) root=$PWD; lib=libinfrastore_ffi.dylib ;;
            # `pwd -W` yields a native D:/... path. Bash's own /d/... form is
            # not something the Windows loader can dlopen.
            Windows) root=$(pwd -W); lib=infrastore_ffi.dll ;;
            *) echo "unsupported runner: $RUNNER_OS" >&2; exit 1 ;;
          esac
          export INFRASTORE_LIB="$root/target/debug/$lib"
          test -f "$INFRASTORE_LIB" || { echo "missing cdylib: $INFRASTORE_LIB" >&2; exit 1; }
          # An `if` rather than `[ ... ] && covflags=(...)`: GitHub runs this
          # shell with `-e`, and a trailing AND-list that evaluates false is
          # itself a failing command, which would abort the step on non-Linux.
          # `user` rather than the narrower `--code-coverage=@<path>`: the path
          # form silently produces nothing if the prefix does not match how
          # Julia records the file, whereas `user` cannot miss. Scoping happens
          # in the report step, which reads only the package's src tree.
          covflags=()
          if [ "$RUNNER_OS" = Linux ]; then
            covflags=(--code-coverage=user)
          fi
          julia --project=julia/InfraStore.jl -e 'using Pkg; Pkg.instantiate()'
          julia --project=julia/InfraStore.jl "${covflags[@]}" \
            julia/InfraStore.jl/test/runtests.jl
          # Again through Pkg.test, which is the only environment that has the
          # TimeZones weak dependency and can therefore load
          # InfraStoreTimeZonesExt. The run above skips those tests with a
          # warning, because a weak dependency is not loadable from the
          # package's own project; this is what actually exercises them.
          # Linux only: it is one platform's worth of a pure-Julia conversion,
          # and it pays a second full suite plus a tz-database install.
          if [ "$RUNNER_OS" = Linux ]; then
            julia --project=julia/InfraStore.jl -e 'using Pkg; Pkg.test()'
          fi

      # Render both reports from the profiles all three suites just wrote.
      # `--ignore-filename-regex` drops the protobuf code infrastore-proto's build
      # script generates into target/; build scripts are themselves excluded
      # unless --include-build-script is passed, so the vendored HDF5
      # build stays out of the numbers.
      #
      # `--remap-path-prefix` is deliberately absent: it only takes effect at
      # compile time, and the builds above are plain cargo invocations, so it
      # would be silently inert here. The absolute paths llvm-cov emits are
      # rewritten afterwards with sed instead -- Codecov matches report paths
      # against the repo tree, and an absolute SF: line matches nothing, which
      # surfaces as an upload that succeeds and a report covering no files.
      - name: Report Rust coverage
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          ignore='(^|/)target/'
          cargo llvm-cov report --lcov --output-path lcov.info \
            --ignore-filename-regex "$ignore"
          sed -i "s|^SF:$PWD/|SF:|" lcov.info
          if grep -q '^SF:/' lcov.info; then
            echo "lcov.info still holds absolute paths; Codecov will not map them" >&2
            grep '^SF:/' lcov.info | head >&2
            exit 1
          fi
          {
            echo '### Rust coverage (cargo llvm-cov)'
            echo ''
            echo 'Rust, Python, and Julia suites combined.'
            echo '```'
            cargo llvm-cov report --ignore-filename-regex "$ignore" | sed "s|$PWD/||"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Coverage.jl is run from a temp project rather than through
      # julia-actions/julia-processcoverage, which writes to a fixed lcov.info
      # at the repo root and would clobber the Rust report above. Handing
      # process_folder a relative path keeps the emitted paths relative too,
      # which is what Codecov needs.
      - name: Report Julia coverage
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          julia -e '
            using Pkg
            Pkg.activate(; temp=true)
            Pkg.add("Coverage")
            using Coverage
            cov = process_folder("julia/InfraStore.jl/src")
            LCOV.writefile("julia-lcov.info", cov)
            covered, total = get_summary(cov)
            pct = total == 0 ? 0.0 : 100 * covered / total
            open(ENV["GITHUB_STEP_SUMMARY"], "a") do io
                println(io, "### Julia coverage (Coverage.jl)\n")
                println(io, "julia/InfraStore.jl/src only; the Rust code this ",
                            "suite drives is counted in the llvm-cov report above.\n")
                println(io, "```")
                for f in sort(cov; by = x -> x.filename)
                    c, t = get_summary(f)
                    p = t == 0 ? 0.0 : 100 * c / t
                    println(io, rpad(f.filename, 56), lpad(string(c, "/", t), 12),
                                lpad(string(round(p; digits = 2), "%"), 10))
                end
                println(io, "-"^78)
                println(io, rpad("TOTAL", 56), lpad(string(covered, "/", total), 12),
                            lpad(string(round(pct; digits = 2), "%"), 10))
                println(io, "```")
            end
          '
          # Coverage.jl scatters <source>.<pid>.cov files through the tree; drop
          # them so nothing downstream mistakes them for tracked files.
          find julia -name '*.cov' -delete

      - name: Upload Rust coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          flags: rust
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

      - name: Upload Julia coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v5
        with:
          files: julia-lcov.info
          flags: julia
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

      # Kept alongside the Codecov upload so the raw reports stay reachable
      # when Codecov is unavailable.
      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: |
            lcov.info
            julia-lcov.info

  # The only job that exercises artifact-based library resolution: everywhere
  # else INFRASTORE_LIB points at the locally built cdylib, so with the
  # variable set the Artifacts.toml path never runs at all. This downloads the
  # *released* binary named by Artifacts.toml, so it is deliberately a smoke
  # test, not the full suite: between releases the wrapper on main may grow
  # calls the released FFI does not export yet, and the full suite would fail
  # spuriously. The suite runs against the artifact anyway right before each
  # registration (see docs/src/releasing.md).
  julia-artifact:
    name: Julia artifact resolution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"

      - name: Resolve the library through Artifacts.toml
        shell: bash
        run: |
          set -euo pipefail
          unset INFRASTORE_LIB
          julia --project=julia/InfraStore.jl -e 'using Pkg; Pkg.instantiate()'
          julia --project=julia/InfraStore.jl <<'JULIA'
          using Dates
          using InfraStore

          path = InfraStore.lib_path()
          startswith(path, first(Base.DEPOT_PATH)) ||
              error("expected an artifact path in the depot, got: $(path)")
          println("resolved: ", path)

          store = Store(; in_memory=true)
          ts = SingleTimeSeries(
              DateTime(2024, 1, 1), Hour(1), collect(1.0:24.0), "smoke"
          )
          key = add_time_series!(store, 1, "Generator", Component, ts)
          got = get_time_series(store, key)
          got.data == collect(1.0:24.0) || error("round trip mismatch")
          println("artifact round trip OK")
          JULIA
