# Publish the Rust crates to crates.io on a tagged release.
#
# `cargo publish --workspace` resolves the intra-workspace dependency order
# itself (core -> proto -> ffi/server/cli) and waits for each crate to appear in
# the index before publishing the ones that depend on it, so the crates must not
# be listed individually here. `infrastore-py` and `infrastore-bench` set
# `publish = false` in their manifests and are skipped automatically: the former
# ships as the `infrastore` wheel on PyPI, the latter is an internal tool.
name: crates-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Verify packaging without uploading"
        type: boolean
        default: true

jobs:
  publish:
    name: publish to crates.io
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup protobuf compiler
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # No HDF5/NetCDF provisioning, and never set HDF5_DIR/NETCDF_DIR here --
      # the default `vendored` feature builds netcdf-c + HDF5 + zlib from source.
      # See the long comment in test.yml for why those variables break the build.

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check the tag matches the workspace version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(cargo metadata --no-deps --format-version 1 |
            jq -r '.packages[] | select(.name == "infrastore-core") | .version')"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::tag v$tag does not match workspace version $manifest"
            exit 1
          fi
          echo "publishing version $manifest"

      # crates.io rejects re-uploading a version that already exists, which would
      # fail the whole job. That is not hypothetical: the very first release had
      # to be published by hand, because a trusted publisher can only be
      # configured on a crate that already exists. Re-running a release, or
      # tagging after a manual publish, should be a no-op rather than a red X.
      - name: Check what still needs publishing
        id: pending
        run: |
          set -euo pipefail
          metadata="$(cargo metadata --no-deps --format-version 1)"
          version="$(jq -r '.packages[] | select(.name == "infrastore-core") | .version' <<<"$metadata")"
          # `publish: []` means publish = false; `null` means publishable.
          crates="$(jq -r '[.packages[] | select(.publish != []) | .name] | sort | join(" ")' <<<"$metadata")"
          pending=""
          for crate in $crates; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' \
              -A "infrastore-release (github-actions)" \
              "https://crates.io/api/v1/crates/$crate/$version")"
            if [ "$code" = "200" ]; then
              echo "$crate $version already on crates.io"
            else
              echo "$crate $version needs publishing (HTTP $code)"
              pending="$pending $crate"
            fi
          done
          if [ -z "$pending" ]; then
            echo "::notice::every publishable crate is already at $version; nothing to upload"
            echo "any=false" >> "$GITHUB_OUTPUT"
          else
            echo "any=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate with crates.io
        if: ${{ !inputs.dry_run && steps.pending.outputs.any == 'true' }}
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      # Verification is left on deliberately: it rebuilds each packaged crate
      # from its own tarball, which is what catches a file that builds in the
      # workspace but was never included in the `.crate` (a path reaching
      # outside the package root, say). It recompiles the vendored netcdf-c and
      # HDF5 stack per crate, so expect this step to take on the order of ten
      # minutes -- worth it for an irreversible upload.
      - name: Publish
        if: ${{ !inputs.dry_run && steps.pending.outputs.any == 'true' }}
        run: cargo publish --workspace
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Dry run
        if: ${{ inputs.dry_run }}
        run: cargo publish --workspace --dry-run
