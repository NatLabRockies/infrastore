[workspace]
resolver = "2"
members = [
    "crates/infrastore-core",
    "crates/infrastore-proto",
    "crates/infrastore-server",
    "crates/infrastore-py",
    "crates/infrastore-ffi",
    "crates/infrastore-cli",
    "crates/infrastore-bench",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"
license = "BSD-3-Clause"
repository = "https://github.com/NatLabRockies/infrastore"
readme = "README.md"

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
csv = "1"
ndarray = "0.16"
netcdf = "0.12"
prost = "0.14"
prost-types = "0.14"
sha2 = "0.10"
thiserror = "1"
# `default-features = false` here so each member crate re-enables vendoring
# through its own `vendored` feature (see `infrastore-core`'s manifest). A workspace
# member cannot override an inherited dependency's `default-features`, so the
# opt-out has to live at this level for `--no-default-features` to mean anything.
infrastore-core = { version = "0.1.0", path = "crates/infrastore-core", default-features = false }
infrastore-proto = { version = "0.1.0", path = "crates/infrastore-proto", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync"] }
# `default-features = false` drops the `derive` feature (and its unmaintained
# `proc-macro-error2` transitive dep); the CLI builds tables via the Builder API.
# `ansi` keeps column widths correct when header cells carry ANSI color codes.
tabled = { version = "0.20", default-features = false, features = ["std", "ansi"] }
tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
toml = "0.8"
rusqlite = { version = "0.31", features = ["bundled", "chrono", "blob"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
pyo3 = "0.29"
numpy = "0.29"
cbindgen = "0.29"

[profile.release]
lto = "thin"
codegen-units = 1
