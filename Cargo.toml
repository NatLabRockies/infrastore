[workspace]
resolver = "2"
members = [
    "crates/time-series-store-core",
    "crates/time-series-store-proto",
    "crates/time-series-store-server",
    "crates/time-series-store-py",
    "crates/time-series-store-ffi",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/NatLabRockies/time-series-store"

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
ndarray = "0.16"
netcdf = "0.12"
prost = "0.14"
prost-types = "0.14"
sha2 = "0.10"
thiserror = "1"
time-series-store-core = { path = "crates/time-series-store-core" }
time-series-store-proto = { path = "crates/time-series-store-proto" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync"] }
tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
toml = "0.8"
rusqlite = { version = "0.31", features = ["bundled", "chrono", "blob"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
pyo3 = "0.28"
numpy = "0.28"
cbindgen = "0.29"

[profile.release]
lto = "thin"
codegen-units = 1
