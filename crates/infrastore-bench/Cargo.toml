[package]
name = "infrastore-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Performance benchmarks for infrastore"
# Internal development tool: useful only against this workspace's own crates,
# so it is not published to crates.io.
publish = false

[[bin]]
name = "infrastore-bench"
path = "src/main.rs"

# Forwarded so that opting out of vendoring is possible graph-wide; see
# `infrastore-core`'s manifest for the full tradeoff.
[features]
default = ["vendored"]
vendored = ["infrastore-core/vendored"]

[dependencies]
infrastore-core = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true, features = ["env", "color"] }
tempfile = "3"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
