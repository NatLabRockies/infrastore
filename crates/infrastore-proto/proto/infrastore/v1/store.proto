syntax = "proto3";

package infrastore.v1;

// Read-only gRPC service for `infrastore`.
//
// All write operations (add, remove, clear, compact) require local filesystem
// access and are NOT exposed through this service.
service CatalogStore {
  // Identify: which series exist, and the id that addresses each.
  rpc ListMetadata           (ListMetadataReq)           returns (ListMetadataResp);
  rpc ListMetadataByIds      (ListMetadataByIdsReq)      returns (ListMetadataByIdsResp);
  rpc GetMetadataById        (GetMetadataByIdReq)        returns (TimeSeriesMetadata);
  rpc AssociationExists      (AssociationExistsReq)      returns (AssociationExistsResp);
  rpc HasAnyTimeSeries       (HasAnyTimeSeriesReq)       returns (HasAnyTimeSeriesResp);

  // Act: every read takes the id an identify call handed back.
  rpc ReadById               (ReadByIdReq)               returns (ReadByIdResp);
  rpc ReadByIds              (ReadByIdsReq)              returns (ReadByIdsResp);
  // Evaluate a PersistentTimeSeries at instants the client names. A read, so it
  // belongs on a read-only service.
  rpc ReadProjected          (ReadProjectedReq)          returns (ReadProjectedResp);

  // Aggregates and maintenance.
  rpc GetResolutions         (GetResolutionsReq)         returns (GetResolutionsResp);
  rpc GetIntervals           (GetIntervalsReq)           returns (GetIntervalsResp);
  rpc GetCounts              (GetCountsReq)              returns (GetCountsResp);
  rpc GetDetailedCounts      (GetDetailedCountsReq)      returns (GetDetailedCountsResp);
  rpc GetCountsByType        (GetCountsByTypeReq)        returns (GetCountsByTypeResp);
  rpc GetForecastParameters  (GetForecastParametersReq)  returns (GetForecastParametersResp);
  rpc ListOwnerIds           (ListOwnerIdsReq)           returns (ListOwnerIdsResp);
  rpc GetStaticSummary       (GetStaticSummaryReq)       returns (GetStaticSummaryResp);
  rpc GetForecastSummary     (GetForecastSummaryReq)     returns (GetForecastSummaryResp);
  rpc CheckStaticConsistency (CheckStaticConsistencyReq) returns (CheckStaticConsistencyResp);
  rpc VerifyIntegrity        (VerifyIntegrityReq)        returns (VerifyIntegrityResp);
}

// ---- Common types ----

enum TimeSeriesType {
  SINGLE_TIME_SERIES                 = 0;
  NON_SEQUENTIAL_TIME_SERIES         = 1;
  DETERMINISTIC                      = 2;
  DETERMINISTIC_SINGLE_TIME_SERIES   = 3;
  PROBABILISTIC                      = 4;
  SCENARIOS                          = 5;
  // Appended, never renumbered: the numbers are the wire contract, and they
  // match `TimeSeriesType::code` on the storage side.
  PERSISTENT_TIME_SERIES             = 6;
}

enum OwnerCategory {
  COMPONENT               = 0;
  SUPPLEMENTAL_ATTRIBUTE  = 1;
}

message FeatureValue {
  oneof value {
    int64  int_value   = 1;
    double float_value = 2;
    bool   bool_value  = 3;
    string str_value   = 4;
  }
}

message Features {
  map<string, FeatureValue> entries = 1;
}


message TimeSeriesMetadata {
  int64           owner_id                       = 1;
  string          owner_type                     = 2;
  OwnerCategory   owner_category                 = 3;
  TimeSeriesType  time_series_type               = 4;
  string          name                           = 5;
  bytes           data_hash                      = 6;        // 32 bytes
  // Temporal — populated when applicable to the time series type. `optional`
  // (rather than an empty-string / zero sentinel) so genuinely-present values
  // like length == 0 decode correctly.
  optional string initial_timestamp_rfc3339      = 7;
  optional string resolution                     = 8;        // ISO-8601 duration
  optional uint64 length                         = 9;
  optional string horizon                        = 10;       // ISO-8601 duration
  optional string interval                       = 11;       // ISO-8601 duration
  optional uint64 count                          = 12;
  repeated string timestamps_rfc3339             = 13;
  Features        features                       = 14;
  optional string units                          = 16;
  // Element typing.
  reserved 17;  // was: int32 dtype (Dtype code), superseded by element_type
  repeated uint64 element_shape                  = 18;       // per-step trailing dims
  optional string application_data               = 19;       // opaque package-owned payload
  repeated double percentiles                    = 20;       // Probabilistic only
  // Canonical ElementType string: a dtype spelling ("f64", "i64", ...) for
  // plain scalars, else "tuple(N,dtype)" or a function-data kind
  // ("linear_function", "quadratic_function", "piecewise_linear",
  // "piecewise_step"). The physical dtype of the bytes is derived from it.
  string          element_type                   = 21;
  // What kind of physical quantity the values measure, free-form, with QUDT
  // `QuantityKind` local names as the recommended vocabulary.
  optional string quantity_kind                  = 22;
  // `UnitSystem::as_str`: "natural_units" or "component_base". Absent means
  // unspecified, NOT natural units. Sent as a string rather than an enum so a
  // basis added later reaches an older client as a value it can report rather
  // than as UNKNOWN.
  optional string unit_system                    = 23;
  // The field on the owning component (or supplemental attribute) whose value
  // these values are the time-varying form of, e.g. "max_active_power".
  // Free-form and never interpreted by the store.
  optional string component_field                = 24;
  // `TimeReference::as_storage_string`: how this series' timestamps were
  // spelled. Descriptive, so it sits outside the identity the catalog files
  // this row under; absent means unspecified, NOT a claim of UTC.
  optional string time_reference                 = 25;
  // The catalog row's own id -- the handle a consumer stores in its own model
  // to reference this series later. Transmitted rather than derived: nothing
  // computes it from the identity tuple, so the serving store is the only
  // thing that knows it. Absent only for metadata that never came from a
  // catalog; every row a server returns carries one.
  optional int64  id                             = 26;
}

// ---- ListMetadata / ListMetadataByIds ----

message ListMetadataReq {
  optional int64           owner_id          = 1;
  optional string          owner_type        = 2;
  optional TimeSeriesType  time_series_type  = 3;
  optional string          name              = 4;
  optional string          resolution        = 5;       // ISO-8601 duration
  Features                 features          = 6;
  optional OwnerCategory   owner_category    = 7;
  optional string          interval          = 8;       // ISO-8601 duration
  // Exact, case-sensitive match on the owning component's field. A row that
  // declares none matches no value, so this cannot select rows that left it
  // unset.
  optional string          component_field   = 9;
  // Coherence predicate on the timestamp spelling: true selects the zoneless
  // series, false selects everything that accepts a zoned bound — the three
  // zoned spellings AND the rows that left the reference unset. A binary
  // predicate rather than an exact match, because an exact match cannot name
  // that second group.
  optional bool            zoneless          = 10;
}
message ListMetadataResp {
  repeated TimeSeriesMetadata metadata = 1;
}

// ListMetadata addressed by id instead of by attributes -- the bulk companion
// to GetMetadataById, and what a consumer hydrating a model full of recorded
// ids wants: one catalog query for the whole set rather than one call per
// reference. Rows come back in the order the ids are given, repeats once each
// in place. NOT_FOUND if any id names no row: a caller naming ids is asserting
// they exist, and a silently short result would let a stale reference pass as
// an absent match.
message ListMetadataByIdsReq {
  repeated int64 ids = 1;
}
message ListMetadataByIdsResp {
  repeated TimeSeriesMetadata metadata = 1;
}

// ---- ReadById / ReadByIds ----

message ReadByIdReq {
  // The catalog association id, from a ListMetadata row.
  int64          id                        = 1;
  // Optional time-range slicing on the time axis.
  optional string start_rfc3339            = 2;
  optional string end_rfc3339              = 3;
  // Whether the client spelled those bounds without a zone. A bound has to be
  // spelled the way the series is: a wall-clock bound against a series that
  // records instants, or an instant bound against a zoneless one, is refused
  // rather than coerced. Absent means zoned, which is what an RFC3339 bound is.
  optional bool   bounds_zoneless          = 4;
}
message ReadByIdResp {
  string             initial_timestamp_rfc3339  = 1;
  string             resolution                 = 2;        // ISO-8601 duration
  uint64             length                     = 3;
  repeated uint64    shape                      = 4;
  reserved 5;  // was: repeated double values (replaced by dtype + value_bytes)
  TimeSeriesType     time_series_type            = 6;
  repeated string    timestamps_rfc3339          = 7;
  reserved 8;  // was: int32 dtype (Dtype code), superseded by element_type
  bytes              value_bytes                 = 9;        // raw little-endian, row-major
  // Unused: always the empty string. `application_data` is a property of the association
  // row, not of the time-series values, so the read path has no value to put
  // here — the server builds this message from the data alone. Read `application_data` from
  // GetMetadata or ListTimeSeries instead (TimeSeriesMetadata.application_data, field 19).
  // Kept rather than reserved so the field numbering stays stable for existing
  // consumers; do not start populating it without deciding what a client is
  // meant to do with a value that has no home in the data types.
  string             application_data                = 10;
  // Forecast-specific fields (fields 1–10 are backward-compatible).
  string             horizon                     = 11;       // ISO-8601 duration
  string             interval                    = 12;       // ISO-8601 duration
  uint64             count                       = 13;
  repeated double    percentiles                 = 14;       // Probabilistic only
  uint64             scenario_count              = 15;       // Scenarios only
  // Canonical ElementType string; see TimeSeriesMetadata.element_type. Decoding
  // stays client-side: the server ships raw `value_bytes` plus `shape` and this
  // field, and a codec turns them into per-timestep values.
  string             element_type                = 16;
  // Unit descriptors, mirroring the same fields on TimeSeriesMetadata (16, 22,
  // 23, 24). Unlike `application_data` above these *are* properties of the
  // time-series data types, and the core populates them on every local read, so
  // omitting them made a value read over gRPC return a series whose descriptors
  // were all unset where the identical local call returned them. `optional` so
  // "absent" stays distinct from the empty string, exactly as on the metadata
  // message — for `unit_system` in particular, absent means *unspecified*, not
  // natural units.
  optional string    units                       = 17;
  optional string    quantity_kind               = 18;
  optional string    unit_system                 = 19;
  optional string    component_field             = 20;
  optional string    time_reference              = 21;
  // The series' name.
  //
  // Like the unit descriptors above this is a property of the time-series data
  // types, which the core populates on every local read. It used to be
  // reconstructible on the client because a read named a key, which carried the
  // name; a read now names only an id, so without this field every series read
  // over gRPC came back with an empty name where the identical local call
  // returned it.
  string             name                        = 22;
}

// ---- GetResolutions ----

message GetResolutionsReq {
  optional TimeSeriesType time_series_type = 1;
}
message GetResolutionsResp {
  repeated string resolution = 1;       // ISO-8601 durations
}

// ---- GetCounts ----

message GetCountsReq {}
message GetCountsResp {
  int64 components_with_time_series = 1;
  int64 static_time_series          = 2;
  int64 forecasts                   = 3;
}

// ---- GetForecastParameters ----

message GetForecastParametersReq {
  optional string resolution = 1;       // ISO-8601 duration filter
  optional string interval   = 2;       // ISO-8601 duration filter
}
// All fields optional: absent when the store holds no forecasts (or that
// particular field is not populated for the forecast type found).
message GetForecastParametersResp {
  optional string horizon                   = 1;   // ISO-8601 duration
  optional string interval                  = 2;   // ISO-8601 duration
  optional uint64 count                     = 3;
  optional string resolution                = 4;   // ISO-8601 duration
  optional string initial_timestamp_rfc3339 = 5;
}

// ---- HasAnyTimeSeries ----

// An existence probe stays attribute-addressed: it is answered off the catalog
// indexes without hydrating a row, so posing it through a resolution would cost
// more than the question. `features` matches the whole set, not a subset.
message HasAnyTimeSeriesReq {
  int64          owner_id       = 1;
  OwnerCategory  owner_category = 2;
  string         name           = 3;
  optional TimeSeriesType time_series_type = 4;
  optional string resolution    = 5;   // ISO-8601 duration
  optional string interval      = 6;   // ISO-8601 duration
  map<string, FeatureValue> features = 7;
}
message HasAnyTimeSeriesResp {
  bool present = 1;
}

// ---- VerifyIntegrity ----

message VerifyIntegrityReq {}
message VerifyIntegrityResp {
  repeated string errors = 1;
}

// ---- Aggregates, summaries and maintenance ----

// One request message per RPC even where it carries no field today, so a later
// filter lands as an added field rather than a new message and a second RPC.
message GetDetailedCountsReq {}
message GetCountsByTypeReq {}
message GetStaticSummaryReq {}
message GetForecastSummaryReq {}

// The metadata of one association, by catalog id. NOT_FOUND if the id names no
// row -- a call already committed to fetching treats a stale reference as a
// failure, where AssociationExists treats it as an answer.
message GetMetadataByIdReq {
  int64 id = 1;
}

// Whether an association is filed under a catalog id. A primary-key probe that
// fetches no row, so a consumer can validate every reference in its own model
// on load rather than discovering a dangling one mid-run. An id is never
// reissued once its row is deleted, so a reference that stops resolving stays
// stale -- it can never come to name a different series.
message AssociationExistsReq {
  int64 id = 1;
}
message AssociationExistsResp {
  bool present = 1;
}

// ReadByIds: fetch several series (any variant) at once, optionally time-sliced.
message ReadByIdsReq {
  repeated int64         ids           = 1;
  optional string        start_rfc3339 = 2;
  optional string        end_rfc3339   = 3;
  // See ReadByIdReq.bounds_zoneless. A ranged bulk read is additionally refused when
  // the selection mixes zoneless series with series that record instants: one
  // bound cannot be valid for both.
  optional bool          bounds_zoneless = 4;
}
message ReadByIdsResp {
  repeated ReadByIdResp items = 1;   // aligned with the request ids
}

// ---- ReadProjected ----
//
// The step-function evaluation, for a PersistentTimeSeries only: the value in
// force at each named instant, gathered in the order asked for. Every other
// stored type is refused, because projecting one would need a resampling policy
// that is the client's choice to make, where hold-last needs no choice at all.
message ReadProjectedReq {
  // The catalog association id, from a ListMetadata row.
  int64           id              = 1;
  // The instants to evaluate at. A gather, not a slice: they may be unsorted and
  // may repeat, and this order is the response order. Empty yields an empty
  // array rather than an error.
  repeated string at_rfc3339      = 2;
  // See ReadByIdReq.bounds_zoneless. These instants are query bounds like any
  // other and must be spelled the way the series is; an empty list names no
  // bound and so is not checked.
  optional bool   bounds_zoneless = 3;
}
message ReadProjectedResp {
  // [len(at_rfc3339), *element_shape] — the series' own per-step shape, so a
  // row is laid out exactly as one of ReadByIdResp.value_bytes is.
  repeated uint64 shape        = 1;
  bytes           value_bytes  = 2;   // raw little-endian, row-major
  // Canonical ElementType string, carried for the same reason ReadByIdResp
  // carries it: decoding stays client-side, and a projection leaves the element
  // type alone, so the same codec reads this response and that one.
  string          element_type = 3;
}

// GetDetailedCounts.
message GetDetailedCountsResp {
  int64 components_with_time_series                = 1;
  int64 supplemental_attributes_with_time_series   = 2;
  int64 static_time_series_count                   = 3;
  int64 forecast_count                             = 4;
}

// GetCountsByType.
message GetCountsByTypeResp {
  message Entry {
    TimeSeriesType time_series_type = 1;
    int64          count            = 2;
  }
  repeated Entry entries = 1;
}

// ListOwnerIds.
message ListOwnerIdsReq {
  OwnerCategory           owner_category   = 1;
  optional TimeSeriesType time_series_type = 2;
  optional string         resolution       = 3;   // ISO-8601 duration
}
message ListOwnerIdsResp {
  repeated int64 owner_id = 1;
}

// GetIntervals.
message GetIntervalsReq {
  optional TimeSeriesType time_series_type = 1;
}
message GetIntervalsResp {
  repeated string interval = 1;   // ISO-8601 durations
}

// GetStaticSummary / GetForecastSummary.
message StaticSummaryRow {
  string          owner_type                    = 1;
  OwnerCategory   owner_category                = 2;
  TimeSeriesType  time_series_type              = 3;
  string          name                          = 4;
  optional string initial_timestamp_rfc3339     = 5;
  optional string resolution                    = 6;   // ISO-8601 duration
  optional int64  time_step_count               = 7;
  int64           count                         = 8;
}
message GetStaticSummaryResp {
  repeated StaticSummaryRow rows = 1;
}
message ForecastSummaryRow {
  string          owner_type                    = 1;
  OwnerCategory   owner_category                = 2;
  TimeSeriesType  time_series_type              = 3;
  string          name                          = 4;
  optional string initial_timestamp_rfc3339     = 5;
  optional string resolution                    = 6;   // ISO-8601 duration
  optional string horizon                       = 7;   // ISO-8601 duration
  optional string interval                      = 8;   // ISO-8601 duration
  optional int64  window_count                  = 9;
  int64           count                         = 10;
}
message GetForecastSummaryResp {
  repeated ForecastSummaryRow rows = 1;
}

// CheckStaticConsistency.
message CheckStaticConsistencyReq {
  optional string resolution = 1;   // ISO-8601 duration scope
}
message CheckStaticConsistencyResp {
  message Row {
    string resolution                = 1;   // ISO-8601 duration
    string initial_timestamp_rfc3339 = 2;
    uint64 length                    = 3;
  }
  repeated Row rows = 1;
}

