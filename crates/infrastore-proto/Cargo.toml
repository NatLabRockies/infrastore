[package]
name = "infrastore-proto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "Protobuf definitions and conversions for infrastore"
homepage = "https://natlabrockies.github.io/infrastore/"
keywords = ["time-series", "protobuf", "grpc", "infrastore"]
categories = ["encoding", "network-programming"]

# Forwarded so that opting out of vendoring is possible graph-wide; see
# `infrastore-core`'s manifest for the full tradeoff.
[features]
default = ["vendored"]
vendored = ["infrastore-core/vendored"]

[dependencies]
chrono = { workspace = true }
ndarray = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
thiserror = { workspace = true }
infrastore-core = { workspace = true }
tonic = { workspace = true }
tonic-prost = { workspace = true }

[build-dependencies]
tonic-prost-build = { workspace = true }
