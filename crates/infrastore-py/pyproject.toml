[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "infrastore"
version = "0.3.0"
description = "Time-series storage for power-systems and energy simulations"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Daniel Thom", email = "daniel.thom@nlr.gov" }]
keywords = ["time-series", "netcdf", "hdf5", "energy", "simulation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Database",
    "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=1.24"]

[project.urls]
Homepage = "https://natlabrockies.github.io/infrastore/"
Documentation = "https://natlabrockies.github.io/infrastore/latest/"
Repository = "https://github.com/NatLabRockies/infrastore"
Issues = "https://github.com/NatLabRockies/infrastore/issues"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "infrastore"

# cibuildwheel builds one abi3 wheel per platform (the crate targets abi3-py311).
# The cdylib statically links netcdf-c + HDF5 + zlib, built from vendored sources
# by infrastore's default `vendored` feature, so the build environment needs no
# system NetCDF/HDF5 -- only a Rust toolchain, cmake, and a C compiler. Never set
# HDF5_DIR or NETCDF_DIR here: they redirect the vendored netcdf-c build at an
# external HDF5 while still requesting static libraries, which fails.
[tool.cibuildwheel]
build = "cp311-*"
# 32-bit Windows (win32) is skipped: the abi3 wheel targets x64 only.
# musllinux stays skipped for now -- vendoring removes the old blocker (the
# RPM-based `before-all` could not install HDF5 there), but the target has never
# been built or tested. See docs/src/releasing.md.
skip = "*-musllinux* *-win32"
build-frontend = "build"

# Run the suite against each built wheel in its target environment. `netCDF4`
# and `h5py` are here for `test_hdf5_interop.py`: each bundles its own libhdf5,
# so installing them alongside the wheel's statically linked copy is what turns
# "several HDF5 instances in one interpreter" from an assumption into a tested
# property -- on manylinux in particular, where a collision shows up as silent
# symbol interposition rather than a clean import error.
test-requires = ["pytest>=7", "netCDF4", "h5py"]
test-command = "pytest -q {project}/python/tests"

# Install the Rust toolchain before building. The `$HOME/.cargo/bin` PATH override
# is only meaningful where rustup is installed by before-all (Linux/macOS), so it
# is set per-platform rather than globally.
[tool.cibuildwheel.linux]
before-all = "curl -sSf https://sh.rustup.rs | sh -s -- -y"
environment = { PATH = "$HOME/.cargo/bin:$PATH" }

[tool.cibuildwheel.macos]
before-all = "curl -sSf https://sh.rustup.rs | sh -s -- -y"
environment = { PATH = "$HOME/.cargo/bin:$PATH" }

[tool.cibuildwheel.windows]
# Rust is preinstalled on the GitHub Windows runner.
before-all = "rustup default stable"
# The extension has no external NetCDF/HDF5 DLLs left to bundle, but delvewheel
# still vendors any other runtime DLLs the MSVC build pulls in.
before-build = "pip install delvewheel"
repair-wheel-command = "delvewheel repair -w {dest_dir} {wheel}"
