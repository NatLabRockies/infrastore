[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "infrastore"
version = "0.1.0"
description = "Python bindings for infrastore"
requires-python = ">=3.10"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "Daniel Thom" }]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "infrastore"

# cibuildwheel builds one abi3 wheel per platform (the crate targets abi3-py310).
# The cdylib statically links netcdf-c + HDF5 + zlib, built from vendored sources
# by infrastore's default `vendored` feature, so the build environment needs no
# system NetCDF/HDF5 -- only a Rust toolchain, cmake, and a C compiler. Never set
# HDF5_DIR or NETCDF_DIR here: they redirect the vendored netcdf-c build at an
# external HDF5 while still requesting static libraries, which fails.
[tool.cibuildwheel]
build = "cp310-*"
# 32-bit Windows (win32) is skipped: the abi3 wheel targets x64 only.
# musllinux stays skipped for now -- vendoring removes the old blocker (the
# RPM-based `before-all` could not install HDF5 there), but the target has never
# been built or tested. See PACKAGING.md.
skip = "*-musllinux* *-win32"
build-frontend = "build"

# Install the Rust toolchain before building. The `$HOME/.cargo/bin` PATH override
# is only meaningful where rustup is installed by before-all (Linux/macOS), so it
# is set per-platform rather than globally.
[tool.cibuildwheel.linux]
before-all = "curl -sSf https://sh.rustup.rs | sh -s -- -y"
environment = { PATH = "$HOME/.cargo/bin:$PATH" }

[tool.cibuildwheel.macos]
before-all = "curl -sSf https://sh.rustup.rs | sh -s -- -y"
environment = { PATH = "$HOME/.cargo/bin:$PATH" }

[tool.cibuildwheel.windows]
# Rust is preinstalled on the GitHub Windows runner.
before-all = "rustup default stable"
# The extension has no external NetCDF/HDF5 DLLs left to bundle, but delvewheel
# still vendors any other runtime DLLs the MSVC build pulls in.
before-build = "pip install delvewheel"
repair-wheel-command = "delvewheel repair -w {dest_dir} {wheel}"
