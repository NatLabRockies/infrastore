[package]
name = "infrastore-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "Core types, storage, and metadata for infrastore"
homepage = "https://natlabrockies.github.io/infrastore/"
keywords = ["time-series", "hdf5", "energy", "simulation"]
categories = ["science", "database-implementations"]

# `vendored` builds HDF5 and zlib from source (via `hdf5-metno-src`) and links
# them statically, so consumers need no system libhdf5 — the same tradeoff
# `rusqlite`'s `bundled` feature already makes for SQLite. It is on by default
# so downstream crates get a working build for free; opt out with
# `default-features = false` to link the system library instead. Because
# `hdf5-metno-sys` sets `links = "hdf5"`, there is exactly one copy in any
# dependency graph and Cargo's feature unification makes this choice
# all-or-nothing across the whole graph, not per-crate.
#
# The `zlib` feature is required for the DEFLATE filter either way.
#
# Vendoring requires `cmake` and a C compiler at build time, in place of the
# system HDF5 development packages.
[features]
default = ["vendored"]
vendored = ["hdf5-metno/static", "hdf5-metno/zlib"]

[dependencies]
# Reinterprets a `TypedArray`'s little-endian byte buffer as the typed slice
# libhdf5 wants (and back), so a read or write does not also pay for an
# element-by-element copy of the whole array. See `storage/hdf5.rs`.
bytemuck = { workspace = true, features = ["extern_crate_alloc"] }
chrono = { workspace = true }
ndarray = { workspace = true }
thiserror = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
hdf5-metno = { version = "0.14.0", features = ["zlib"] }

# `asm` selects hand-written SHA-256 kernels (and the ARMv8 crypto extensions
# on aarch64), ~5x faster than the portable fallback for content hashing on
# Apple Silicon. sha2-asm does not build under MSVC, so Windows MSVC keeps the
# portable implementation (x86_64 still auto-detects SHA-NI at runtime).
[target.'cfg(not(target_env = "msvc"))'.dependencies]
sha2 = { workspace = true, features = ["asm"] }

[target.'cfg(target_env = "msvc")'.dependencies]
sha2 = { workspace = true }

[dev-dependencies]
cargo-husky = { version = "1", default-features = false, features = ["precommit-hook", "user-hooks"] }
# White-box store perturbation in `disk_roundtrip.rs` (attribute/byte edits
# behind the recorded content hash).
hdf5-metno = "0.14.0"
tempfile = "3"
