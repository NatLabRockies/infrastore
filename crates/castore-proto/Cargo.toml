[package]
name = "castore-proto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Protobuf definitions and conversions for castore"

# Forwarded so that opting out of vendoring is possible graph-wide; see
# `castore-core`'s manifest for the full tradeoff.
[features]
default = ["vendored"]
vendored = ["castore-core/vendored"]

[dependencies]
chrono = { workspace = true }
ndarray = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
thiserror = { workspace = true }
castore-core = { workspace = true }
tonic = { workspace = true }
tonic-prost = { workspace = true }

[build-dependencies]
tonic-prost-build = { workspace = true }
