[package]
name = "infrastore-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "C ABI for infrastore (used by the Julia binding)"
homepage = "https://natlabrockies.github.io/infrastore/"
keywords = ["time-series", "ffi", "julia", "c-abi", "infrastore"]
categories = ["external-ffi-bindings", "science"]

[lib]
name = "infrastore_ffi"
crate-type = ["cdylib", "staticlib"]

# Statically link netcdf-c/HDF5 so the cdylib the Julia binding loads is
# self-contained; see `infrastore-core`'s manifest for the full tradeoff.
[features]
default = ["vendored"]
vendored = ["infrastore-core/vendored"]

[dependencies]
chrono = { workspace = true }
ndarray = { workspace = true }
# For the `Serialize`/`DeserializeOwned` bounds on the association transport
# helpers; the values themselves are (de)serialized by serde_json.
serde = { workspace = true }
serde_json = { workspace = true }
infrastore-core = { workspace = true }
tracing-subscriber = { workspace = true }

[build-dependencies]
cbindgen = { workspace = true }

[dev-dependencies]
# The ABI lifecycle tests create and reopen real store files on disk.
tempfile = "3"
