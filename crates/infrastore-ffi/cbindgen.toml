language = "C"
include_guard = "INFRASTORE_H"
header = """/* Auto-generated by cbindgen. DO NOT EDIT. */

/*
 * ABI conventions
 * ===============
 *
 * These hold for EVERY function below; the per-function comments cover only
 * what is specific to the call.
 *
 * Concurrency. One handle, one thread at a time -- reads included. A handle may
 *   be moved between threads, and handles onto different stores are
 *   independent, but a single handle must never be in two calls at once. A
 *   concurrent pair of reads through one handle is undefined behaviour, not
 *   merely a lost update. The error state is per-thread.
 *
 * Handles. Every handle argument must be live, non-null, created by this
 *   library and not yet freed. A mutating call additionally needs a store
 *   opened read-write.
 *
 * Strings in. Every `const char *` must be null-terminated UTF-8 and stay valid
 *   for the duration of the call. Arguments documented as optional may be null;
 *   the rest may not, and a null one returns INFRASTORE_ERR_NULL_POINTER.
 *
 * Scalars out. Every out-pointer to a scalar must be valid for writing one
 *   value.
 *
 * Owned strings out. An out-pointer naming a string receives either NULL (the
 *   value is unset) or an owned C string the caller must free exactly once with
 *   infrastore_string_free.
 *
 * Owned buffers out. An out-pointer naming a buffer is paired with a length
 *   out-param and must be freed exactly once with the deallocator matching its
 *   element type -- infrastore_buffer_free_u8, _u64, _f64, and so on -- passing
 *   the companion length. A freed pointer must not be used again.
 *
 * Probe-then-fetch. A call taking buf / cap / out_len writes the required
 *   length to out_len and fills buf only when cap is large enough. buf may be
 *   NULL (a length probe); when non-NULL it must be valid for cap bytes.
 *
 * Handles out. A call returning a handle writes it through an out-pointer valid
 *   for one pointer; the caller releases it exactly once with the matching
 *   destructor (infrastore_store_free, infrastore_bulk_result_free, ...). Every
 *   destructor also accepts NULL.
 *
 * Owner arguments. Where a call takes owner_id / owner_category, the category
 *   is 0 = Component, 1 = SupplementalAttribute.
 */"""
autogen_warning = "/* WARNING: this file is auto-generated. */"

[parse]
parse_deps = false

[export]
prefix = ""
include = []
exclude = []

[export.rename]
"InfraStoreHandle" = "InfraStore"
"InfraStoreKeyHandle" = "InfraStoreKey"
"InfraStoreBatchHandle" = "InfraStoreBatch"
