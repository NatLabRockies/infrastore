[package]
name = "castore-py"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Python bindings for castore"

[lib]
name = "castore"
crate-type = ["cdylib"]

# Statically link netcdf-c/HDF5 so a built wheel needs no system libraries; see
# `castore-core`'s manifest for the full tradeoff.
[features]
default = ["vendored"]
vendored = ["castore-core/vendored"]

[dependencies]
chrono = { workspace = true }
ndarray = { workspace = true }
numpy = { workspace = true }
pyo3 = { workspace = true, features = ["extension-module", "abi3-py310", "chrono"] }
castore-core = { workspace = true }
tracing-subscriber = { workspace = true }
