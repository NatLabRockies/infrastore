[package]
name = "castore-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "C ABI for castore (used by the Julia binding)"

[lib]
name = "castore_ffi"
crate-type = ["cdylib", "staticlib"]

[dependencies]
chrono = { workspace = true }
ndarray = { workspace = true }
# For the `Serialize`/`DeserializeOwned` bounds on the association transport
# helpers; the values themselves are (de)serialized by serde_json.
serde = { workspace = true }
serde_json = { workspace = true }
castore-core = { workspace = true }
tracing-subscriber = { workspace = true }

[build-dependencies]
cbindgen = { workspace = true }

[dev-dependencies]
# The ABI lifecycle tests create and reopen real store files on disk.
tempfile = "3"
