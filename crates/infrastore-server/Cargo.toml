[package]
name = "infrastore-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "gRPC server + Rust client for infrastore"
homepage = "https://natlabrockies.github.io/infrastore/"
keywords = ["time-series", "grpc", "server", "energy", "infrastore"]
categories = ["network-programming", "science"]

[[bin]]
name = "infrastore-server"
path = "src/bin/server.rs"

# Statically link HDF5 so the server binary is self-contained; see
# `infrastore-core`'s manifest for the full tradeoff.
[features]
default = ["vendored"]
vendored = ["infrastore-core/vendored", "infrastore-proto/vendored"]

[dependencies]
chrono = { workspace = true }
clap = { workspace = true }
prost = { workspace = true }
serde = { workspace = true }
infrastore-core = { workspace = true }
infrastore-proto = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tonic = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tempfile = "3"
# Used only by `tests/server_binary.rs`, to edit a catalog's generation stamp
# directly and build the mismatched artifact the server must refuse to serve.
rusqlite = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tokio-stream = { version = "0.1", features = ["net"] }
ndarray = { workspace = true }
