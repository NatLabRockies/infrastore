[package]
name = "infrastore-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "gRPC server + Rust client for infrastore"

[[bin]]
name = "infrastore-server"
path = "src/bin/server.rs"

# Statically link netcdf-c/HDF5 so the server binary is self-contained; see
# `infrastore-core`'s manifest for the full tradeoff.
[features]
default = ["vendored"]
vendored = ["infrastore-core/vendored", "infrastore-proto/vendored"]

[dependencies]
chrono = { workspace = true }
clap = { workspace = true }
prost = { workspace = true }
serde = { workspace = true }
infrastore-core = { workspace = true }
infrastore-proto = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tonic = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }
tokio-stream = { version = "0.1", features = ["net"] }
ndarray = { workspace = true }
